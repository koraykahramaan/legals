<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tendify – Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #faf7f2; color: #1f1e1b;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 48px 40px;
      max-width: 480px; width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo-icon {
      width: 72px; height: 72px; border-radius: 18px;
      background: linear-gradient(135deg, #5baeac, #3f8c8a);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 20px;
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    p { color: #5b5a55; margin-bottom: 32px; font-size: 16px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .link-btn {
      display: block; padding: 16px 24px;
      background: #f0f8f7; border-radius: 14px;
      text-decoration: none; color: #2e6f6d;
      font-weight: 600; font-size: 16px;
      border: 1px solid #dceeed;
      transition: background 0.15s;
    }
    .link-btn:hover { background: #dceeed; }
    .link-btn span { font-weight: 400; color: #5b5a55; font-size: 14px; display: block; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-icon">🌿</div>
    <h1>Tendify</h1>
    <p>Legal documents for Tendify — the patient care coordination app.</p>
    <div class="links">
      <a href="privacy.html" class="link-btn">
        Privacy Policy
        <span>Gizlilik Politikası</span>
      </a>
      <a href="terms.html" class="link-btn">
        Terms of Service
        <span>Kullanım Koşulları</span>
      </a>
    </div>
  </div>
</body>
</html>
